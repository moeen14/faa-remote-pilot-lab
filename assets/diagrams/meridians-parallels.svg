<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" font-family="DM Sans, system-ui, sans-serif">
  <rect x="0" y="0" width="600" height="620" fill="#f5f0e7"/>

  <g stroke="#12233f" stroke-width="2" fill="none">
    <circle cx="300" cy="300" r="240"/>
    <!-- parallels (latitude) -->
    <ellipse cx="300" cy="300" rx="240" ry="86" stroke-width="3"/>
    <ellipse cx="300" cy="205" rx="220" ry="55"/>
    <ellipse cx="300" cy="130" rx="165" ry="34"/>
    <ellipse cx="300" cy="395" rx="220" ry="55"/>
    <ellipse cx="300" cy="470" rx="165" ry="34"/>
    <!-- meridians (longitude) -->
    <path d="M300,60 Q160,300 300,540"/>
    <path d="M300,60 Q90,300 300,540" stroke-dasharray="0"/>
    <path d="M300,60 Q440,300 300,540"/>
    <path d="M300,60 Q510,300 300,540"/>
    <path d="M300,60 L300,540" stroke-width="3"/>
  </g>

  <circle cx="300" cy="300" r="3.5" fill="#e45f3c"/>

  <g stroke="#44516a" stroke-width="2">
    <line x1="300" y1="300" x2="470" y2="300"/>
    <path d="M460,294 L472,300 L460,306" fill="none"/>
  </g>
  <text x="480" y="305" fill="#44516a" font-size="18" font-weight="700">Longitude</text>

  <g stroke="#44516a" stroke-width="2">
    <line x1="300" y1="300" x2="300" y2="440"/>
    <path d="M294,430 L300,442 L306,430" fill="none"/>
  </g>
  <text x="230" y="470" fill="#44516a" font-size="18" font-weight="700">Latitude</text>

  <text x="300" y="304" fill="#e45f3c" font-size="15" text-anchor="middle" font-weight="700">EQUATOR</text>
  <text x="300" y="580" fill="#44516a" font-size="14" text-anchor="middle">Original schematic: parallels measure north/south position; meridians measure east/west position.</text>
</svg>
