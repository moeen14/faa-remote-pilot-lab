<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="DM Sans, system-ui, sans-serif">
  <rect x="0" y="0" width="1000" height="420" fill="#f5f0e7"/>

  <defs>
    <marker id="arrow-up" markerWidth="8" markerHeight="8" refX="4" refY="0" orient="auto">
      <path d="M0,8 L4,0 L8,8 Z" fill="#1d7f78"/>
    </marker>
    <marker id="arrow-down" markerWidth="8" markerHeight="8" refX="4" refY="8" orient="auto">
      <path d="M0,0 L4,8 L8,0 Z" fill="#bf4127"/>
    </marker>
  </defs>

  <line x1="330" y1="40" x2="330" y2="380" stroke="#c8c2b6" stroke-width="2"/>
  <line x1="670" y1="40" x2="670" y2="380" stroke="#c8c2b6" stroke-width="2"/>

  <!-- Cumulus stage -->
  <g>
    <ellipse cx="165" cy="300" rx="70" ry="55" fill="#c8c2b6" stroke="#44516a" stroke-width="2"/>
    <ellipse cx="130" cy="260" rx="45" ry="40" fill="#c8c2b6" stroke="#44516a" stroke-width="2"/>
    <ellipse cx="200" cy="255" rx="50" ry="45" fill="#c8c2b6" stroke="#44516a" stroke-width="2"/>
    <line x1="165" y1="330" x2="165" y2="150" stroke="#1d7f78" stroke-width="4" marker-end="url(#arrow-up)"/>
    <line x1="130" y1="330" x2="130" y2="170" stroke="#1d7f78" stroke-width="4" marker-end="url(#arrow-up)"/>
    <line x1="200" y1="330" x2="200" y2="170" stroke="#1d7f78" stroke-width="4" marker-end="url(#arrow-up)"/>
    <text x="165" y="60" fill="#12233f" font-size="20" font-weight="700" text-anchor="middle">Cumulus stage</text>
    <text x="165" y="90" fill="#44516a" font-size="14" text-anchor="middle">Updrafts build the cloud;</text>
    <text x="165" y="108" fill="#44516a" font-size="14" text-anchor="middle">no precipitation reaches the ground yet</text>
  </g>

  <!-- Mature stage -->
  <g>
    <ellipse cx="500" cy="290" rx="75" ry="55" fill="#a9a294" stroke="#44516a" stroke-width="2"/>
    <ellipse cx="460" cy="240" rx="50" ry="45" fill="#a9a294" stroke="#44516a" stroke-width="2"/>
    <ellipse cx="540" cy="230" rx="55" ry="50" fill="#a9a294" stroke="#44516a" stroke-width="2"/>
    <rect x="480" y="330" width="40" height="40" fill="#8fb8d8" opacity="0.6"/>
    <line x1="460" y1="330" x2="460" y2="180" stroke="#1d7f78" stroke-width="4" marker-end="url(#arrow-up)"/>
    <line x1="540" y1="360" x2="540" y2="230" stroke="#bf4127" stroke-width="4" marker-end="url(#arrow-down)"/>
    <text x="500" y="60" fill="#12233f" font-size="20" font-weight="700" text-anchor="middle">Mature stage</text>
    <text x="500" y="90" fill="#44516a" font-size="14" text-anchor="middle">Updrafts and downdrafts coexist;</text>
    <text x="500" y="108" fill="#44516a" font-size="14" text-anchor="middle">heavy rain, hail, and turbulence peak</text>
  </g>

  <!-- Dissipating stage -->
  <g>
    <ellipse cx="835" cy="300" rx="75" ry="45" fill="#c8c2b6" stroke="#44516a" stroke-width="2" opacity="0.7"/>
    <ellipse cx="800" cy="270" rx="45" ry="35" fill="#c8c2b6" stroke="#44516a" stroke-width="2" opacity="0.6"/>
    <ellipse cx="870" cy="265" rx="50" ry="35" fill="#c8c2b6" stroke="#44516a" stroke-width="2" opacity="0.6"/>
    <line x1="800" y1="360" x2="800" y2="240" stroke="#bf4127" stroke-width="4" marker-end="url(#arrow-down)"/>
    <line x1="870" y1="355" x2="870" y2="235" stroke="#bf4127" stroke-width="4" marker-end="url(#arrow-down)"/>
    <text x="835" y="60" fill="#12233f" font-size="20" font-weight="700" text-anchor="middle">Dissipating stage</text>
    <text x="835" y="90" fill="#44516a" font-size="14" text-anchor="middle">Downdrafts dominate;</text>
    <text x="835" y="108" fill="#44516a" font-size="14" text-anchor="middle">rain and turbulence taper off</text>
  </g>

  <text x="500" y="400" fill="#44516a" font-size="14" text-anchor="middle">Original schematic of the three-stage thunderstorm life cycle.</text>
</svg>
